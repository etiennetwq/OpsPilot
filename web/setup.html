<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPilot 本机模型配置</title><style>body{font:16px system-ui;background:#0b1220;color:#e4eaf5;max-width:680px;margin:45px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;background:#18283f;color:inherit;border:1px solid #416183;border-radius:8px}button{background:#2868ce;cursor:pointer}p{line-height:1.7;color:#adc0da}a{color:#8db6ff}</style><h1>连接 DeepSeek</h1><p>密钥仅发送到本机服务并保存在内存，关闭服务即失效，不写入文件或报告。诊断时，服务会向 DeepSeek 发送你输入的问题及公开样本的脱敏证据，并产生 API 费用。</p><form id="form"><label>API 密钥<input type="password" id="key" required autocomplete="off" spellcheck="false"></label><label>模型名称<input id="model" value="deepseek-flash" required></label><button>保存到本次服务</button></form><button id="clear">清除当前密钥</button><p id="status"></p><a href="/">返回诊断工作台</a><script>const $=id=>document.getElementById(id);fetch('/config').then(r=>r.json()).then(d=>$('status').textContent=d.configured?'本次服务已配置 '+d.model:'尚未配置');$('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:$('key').value,model:$('model').value})});const d=await r.json();$('key').value='';$('status').textContent=r.ok?'已保存，可返回工作台选择模型自主工具调用。':JSON.stringify(d)};$('clear').onclick=async()=>{await fetch('/config',{method:'DELETE'});$('status').textContent='已清除'};</script></html>
