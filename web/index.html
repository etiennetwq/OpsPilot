<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsPilot · 日志证据工作台</title><style>
:root{font-family:system-ui;color:#e4eaf5;background:#0b1220}body{max-width:1180px;margin:38px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:35px;margin:0}small,.muted{color:#9aacc6}.badge{color:#7de0b2;border:1px solid #315e55;border-radius:20px;padding:8px 15px}main{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.card{background:#141f31;padding:23px;border:1px solid #293950;border-radius:14px}textarea,select,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #39506d;background:#0e1727;color:inherit}textarea{width:calc(100% - 26px);height:94px;margin:10px 0}button{background:#2b66d9;cursor:pointer}button:disabled{opacity:.5}select{margin-right:8px}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65}.evidence{border-left:3px solid #5c92f1;padding:12px;background:#0e1727;margin:12px 0;font-size:13px}a{color:#8db6ff}.chips button{background:#213550;font-size:12px;margin:5px 2px;padding:8px}.wide{grid-column:1/-1}.error{color:#ffc483}@media(max-width:760px){main{grid-template-columns:1fr}} </style>
<header><div><small>OBSERVABILITY / EVIDENCE-FIRST AGENT</small><h1>OpsPilot</h1><p class="muted">真实日志驱动的故障调查 · 每个判断回到证据</p></div><span class="badge" id="health">连接中</span></header>
<main><section class="card"><h2>开始调查</h2><div class="chips"><button onclick="setQ('Directory index forbidden by rule')">目录访问被拒绝</button><button onclick="setQ('mod_jk child workerEnv in error state')">Worker 错误</button><button onclick="setQ('jk2_init cannot find child scoreboard')">子进程记录</button></div><textarea id="q">Directory index forbidden by rule</textarea><p><select id="mode"><option value="hybrid">Hybrid RAG / Agent</option><option value="keyword">关键词 / BM25</option><option value="vector">向量检索</option></select><label><input type="checkbox" id="rerank">本地重排</label></p><p><label><input type="checkbox" id="llm">调用已配置的 LLM API</label></p><button id="run" onclick="run()">检索并诊断 →</button><p class="muted">默认离线。API 模式会向配置的服务商发送问题及脱敏证据。</p><p id="status"></p><pre id="answer">选择场景，查看日志行号、文档出处与只读工具轨迹。</pre></section>
<section class="card"><h2>证据与出处</h2><div id="evidence"></div></section><section class="card wide"><h2>工具轨迹与消耗</h2><pre id="trace">等待调查</pre><p class="muted">历史 Apache / JK2 样本来自 Loghub。事件标签不是根因标签；结果是辅助调查建议。2005 年日志与现代文档存在版本差异。</p><a href="/docs">API 文档</a></section></main>
<script>
const $=id=>document.getElementById(id);function setQ(q){$('q').value=q}fetch('/health').then(r=>r.json()).then(d=>$('health').textContent=d.rows+' 行 · '+d.embedding+' · 本地运行').catch(()=>$('health').textContent='服务未连接');
async function run(){ $('run').disabled=true;$('status').textContent='检索中…';try{const r=await fetch('/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value,mode:$('mode').value,rerank:$('rerank').checked,llm:$('llm').checked})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));$('status').textContent=d.generator+' · '+d.latency_ms+' ms';$('answer').textContent=JSON.stringify(d.answer,null,2);$('evidence').replaceChildren();for(const e of [...d.logs,...d.documents]){const div=document.createElement('div');div.className='evidence';const text=document.createElement('pre');text.textContent=e.id+'  '+(e.time||e.title||'')+'\n'+e.text;div.append(text);if(e.url){const a=document.createElement('a');a.href=e.url;a.target='_blank';a.rel='noopener';a.textContent='查看官方文档';div.append(a)}$('evidence').append(div)}$('trace').textContent=JSON.stringify({trace:d.trace,context:d.context,usage:d.usage,warning:d.warning,provider_error:d.provider_error},null,2)}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}
</script></html>
